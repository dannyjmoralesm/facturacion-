<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Central POS Terminal Frame -->
  <g filter="url(#glow)">
    <rect x="116" y="96" width="280" height="320" rx="36" fill="#1e293b" stroke="#475569" stroke-width="4" />
    
    <!-- Top Emerald Header Bar -->
    <path d="M 116 132 C 116 112 132 96 152 96 L 360 96 C 380 96 396 112 396 132 L 396 160 L 116 160 Z" fill="url(#emeraldGrad)" />
    
    <!-- Cashier Screen Display -->
    <rect x="144" y="184" width="224" height="100" rx="18" fill="#090d16" stroke="#334155" stroke-width="3" />
    
    <!-- Screen Content: Bimoneda Dollar & Bs with Trending Chart -->
    <path d="M 168 245 L 210 220 L 250 235 L 310 205 L 340 215" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="340" cy="215" r="5" fill="#34d399" />
    
    <!-- Currency Symbols in Screen -->
    <text x="168" y="222" fill="#38bdf8" font-family="monospace, sans-serif" font-weight="bold" font-size="20">$ USD</text>
    <text x="340" y="270" text-anchor="end" fill="#fbbf24" font-family="monospace, sans-serif" font-weight="bold" font-size="19">Bs BCV</text>

    <!-- Keypad Grid -->
    <rect x="144" y="304" width="60" height="36" rx="8" fill="#334155" />
    <rect x="226" y="304" width="60" height="36" rx="8" fill="#334155" />
    <rect x="308" y="304" width="60" height="36" rx="8" fill="#334155" />
    
    <rect x="144" y="352" width="60" height="36" rx="8" fill="#334155" />
    <rect x="226" y="352" width="60" height="36" rx="8" fill="#334155" />
    <rect x="308" y="352" width="60" height="36" rx="8" fill="url(#emeraldGrad)" />
  </g>
</svg>
